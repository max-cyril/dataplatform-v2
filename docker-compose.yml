  #     - elasticnet
  #   #command: bash -c "pip install --no-cache-dir -r /requirements.txt && airflow db init && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com && airflow webserver"
# 


  airflow-init:
    image: apache/airflow:2.10.1
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=2n9QfW5cEoZ3V8Y7c5j4lQ8sKp6Tz0R2v8s5QzK3l1o=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./ingestion_init:/opt/airflow/ingestion_init
      - ./es:/opt/airflow/es 
      - ./requirements.txt:/requirements.txt  
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres_airflow
    networks:
      - elasticnet

  airflow-webserver:
    image: apache/airflow:2.10.1
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=2n9QfW5cEoZ3V8Y7c5j4lQ8sKp6Tz0R2v8s5QzK3l1o=
    volumes:
      - ./ingestion_init:/opt/airflow/ingestion_init
      - ./es:/opt/airflow/es 
      - ./requirements.txt:/requirements.txt  
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow-init
      - postgres_airflow

    command: bash -c "pip install --no-cache-dir -r /requirements.txt && airflow webserver"

    networks:
      - elasticnet

  airflow-scheduler:
    image: apache/airflow:2.10.1
    container_name: airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=2n9QfW5cEoZ3V8Y7c5j4lQ8sKp6Tz0R2v8s5QzK3l1o=
    volumes:
      - ./ingestion_init:/opt/airflow/ingestion_init
      - ./es:/opt/airflow/es 
      - ./requirements.txt:/requirements.txt  
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow-init
      - postgres_airflow
    command: bash -c "pip install --no-cache-dir -r /requirements.txt && airflow scheduler"

    networks:
      - elasticnet

  airflow-triggerer:
    image: apache/airflow:2.10.1
    container_name: airflow-triggerer
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=2n9QfW5cEoZ3V8Y7c5j4lQ8sKp6Tz0R2v8s5QzK3l1o=
    volumes:
      - ./ingestion_init:/opt/airflow/ingestion_init
      - ./es:/opt/airflow/es 
      - ./requirements.txt:/requirements.txt  
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow-init
      - postgres_airflow  
    command: bash -c "pip install --no-cache-dir -r /requirements.txt && airflow triggerer"

    networks:
      - elasticnet
  

  postgres_airflow:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - elasticnet

