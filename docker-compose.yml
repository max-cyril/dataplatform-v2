version: "3.9"

services:
  mysql_records:
    image: mysql:8
    container_name: mysql_records
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: records
    ports:
      - "3307:3306"
    volumes:
      - ./init/records.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - elasticnet

  mysql_streams:
    image: mysql:8
    container_name: mysql_streams
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: streams
    ports:
      - "3308:3306"
    volumes:
      - ./init/streams.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - elasticnet
      

  postgres_dwh:
    image: postgres:15
    container_name: postgres_dwh
    environment:
      POSTGRES_DB: dwh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init/init-dwh.sql:/docker-entrypoint-initdb.d/init.sql    - ./init/init-dwh.sql:/docker-entrypoint-initdb.d/init.sql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - elasticnet

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elasticnet
    
  init-es:
    image: python:3.13-slim
    container_name: init-es
    depends_on:
      elasticsearch:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
    command: >
      bash -c "pip install elasticsearch==8.13.0 && python es/init_es.py"
    restart: on-failure
    networks:
      - elasticnet

  # airflow:
  #   image: apache/airflow:2.9.0
