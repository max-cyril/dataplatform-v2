version: 2

models:
  - name: brz_raw__clients
    description: "Bronze model for clients, cleaned and standardized from raw.clients"
    columns:
      - name: client_id
        description: "Unique identifier for each client"
        tests:
          - unique
          - not_null

      - name: client_name
        description: "Standardized client full name (capitalized)"

      - name: client_email
        description: "Normalized email address of the client"
        tests:
          - not_null

      - name: country
        description: "Country of the client"

      - name: created_at
        description: "Timestamp when the client record was created"

      
  - name: brz_raw__product
    description: "Cleaned product dataset with standardized names, emails and timestamps"
    columns:
      - name: product_id
        description: "Unique identifier of the product"
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Standardized product name (capitalized)"
        tests:
          - not_null
      - name: supplier_name
        description: "Standardized supplier name (capitalized)"
      - name: created_at
        description: "Timestamp when the product was created"
        tests:
          - not_null
