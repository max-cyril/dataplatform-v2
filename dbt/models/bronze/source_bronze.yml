version: 2

sources:
  - name: raw_sources
    database: dwh  
    schema: raw  
    tables:
      - name: clients
        description: "Clients table coming from the CRM system"
        columns:
          - name: id
            description: "Unique identifier for each client"
            tests:
              - unique
              - not_null
          - name: name
            description: "Full name of the client"
          - name: email
            description: "Email address of the client"
          - name: country
            description: "Country of origin of the client"
          - name: created_at
            description: "Timestamp when the client record was created"

      - name: orders
        description: "Orders table containing purchases made by clients"
        columns:
          - name: id
            description: "Unique identifier for each order"
            tests:
              - unique
              - not_null
          - name: client_id
            description: "Foreign key referencing the clients table"
            tests:
              - not_null
          - name: product_id
            description: "Foreign key referencing the products table"
            tests:
              - not_null
          - name: quantity
            description: "Quantity of the product ordered"
          - name: total_price
            description: "Total price of the order"
          - name: order_date
            description: "Date when the order was placed"

      - name: product
        description: "Products table listing all available items"
        columns:
          - name: id 
            description: "Unique identifier for each product"
            tests:
              - unique
              - not_null
          - name: name
            description: "Name of the product"
          - name: supplier_name
            description: "Name of the supplier providing the product"
          - name: created_at
            description: "Timestamp when the product record was created"
      
      - name: suppliers
        description: "Suppliers table storing supplier information"
        columns:
          - name: id 
            description: "Unique identifier for each supplier"
            tests:
              - unique
              - not_null
          - name: name
            description: "Name of the supplier"
          - name: email
            description: "Email address of the supplier"
          - name: country
            description: "Country of origin of the supplier"
          - name: created_at
            description: "Timestamp when the supplier record was created"
